<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gamegod AI Scanner</title>
    
    <!-- TensorFlow.js و مدل COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #00ff88;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 136, 0.02),
                rgba(0, 255, 136, 0.02) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 3;
        }

        .hud-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
            text-shadow: 0 0 10px #00ff88;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .info-panel {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ff88;
            padding: 12px 16px;
            font-size: 12px;
            max-width: 280px;
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }

        .info-panel h3 {
            font-size: 13px;
            margin-bottom: 8px;
            color: #fff;
            border-bottom: 1px solid #00ff88;
            padding-bottom: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }

        .object-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .object-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            margin: 3px 0;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            font-size: 11px;
        }

        .hud-bottom {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            font-size: 11px;
            text-align: right;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 14px;
            border: 1px solid #00ff88;
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff3333;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }

        .status-dot.active { background: #00ff88; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn {
            padding: 10px 15px;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-family: inherit;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:active {
            background: rgba(0, 255, 136, 0.4);
        }

        .btn.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-group {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border: 2px solid #00ff88;
            border-radius: 8px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 136, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* پنل تنظیمات OpenRouter */
        .api-config {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff88;
            padding: 12px;
            font-size: 11px;
            border-radius: 4px;
            width: 300px;
        }

        .api-config h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .api-config label {
            display: block;
            margin-top: 8px;
            font-size: 10px;
            opacity: 0.9;
        }

        .api-config input,
        .api-config select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff88;
            color: #00ff88;
            font-family: inherit;
            font-size: 11px;
            margin-top: 4px;
            border-radius: 2px;
        }

        .api-config select {
            cursor: pointer;
        }

        .api-config select option {
            background: #000;
        }

        .model-info {
            margin-top: 6px;
            font-size: 9px;
            opacity: 0.6;
            line-height: 1.4;
        }

        /* پنل پاسخ */
        .response-panel {
            position: fixed;
            bottom: 100px;
            left: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff88;
            padding: 12px;
            font-size: 11px;
            border-radius: 4px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            display: none;
        }

        .response-panel.show {
            display: block;
        }

        .response-panel h4 {
            font-size: 12px;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff6666;
            cursor: pointer;
            font-size: 16px;
        }

        .response-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #00ff88; }

        /* موبایل */
        @media (max-width: 768px) {
            .info-panel, .api-config {
                font-size: 10px;
            }
            .api-config {
                width: 250px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-lines"></div>

    <div class="hud-top">
        ◈ GAMEGOD AI SCANNER ◈<br>
        <small>OPENROUTER VISION MODE</small>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>🤖 در حال بارگذاری مدل هوش مصنوعی...</div>
    </div>

    <!-- پنل اشیا شناسایی‌شده -->
    <div class="info-panel">
        <h3>🎯 اشیا شناسایی‌شده</h3>
        <div class="info-row">
            <span>تعداد:</span>
            <span id="objCount">0</span>
        </div>
        <div class="info-row">
            <span>FPS:</span>
            <span id="fps">--</span>
        </div>
        <div class="object-list" id="objectList">
            <div style="opacity:0.5; text-align:center; padding:10px;">در حال اسکن...</div>
        </div>
    </div>

    <!-- ⚙️ تنظیمات OpenRouter -->
    <div class="api-config">
        <h3>🔑 OpenRouter API</h3>
        
        <label>🔐 API Key (sk-or-...):</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-xxxx...">
        
        <label>🤖 مدل هوش مصنوعی:</label>
        <select id="modelSelect">
            <option value="openai/gpt-4o-mini" selected>🚀 GPT-4o-mini (ارزان و سریع)</option>
            <option value="openai/gpt-4-vision-preview">💎 GPT-4 Vision (دقت بالا)</option>
            <option value="anthropic/claude-3-5-sonnet">🧠 Claude 3.5 Sonnet</option>
            <option value="google/gemini-flash-1.5">⚡ Gemini Flash 1.5 (رایگان)</option>
            <option value="meta-llama/llama-3.2-11b-vision">🦙 Llama 3.2 Vision (رایگان)</option>
        </select>
        
        <div class="model-info">
            💡 برای کلید رایگان از <a href="https://openrouter.ai/keys" style="color:#00ff88">openrouter.ai/keys</a> بگیرید
        </div>
    </div>

    <!-- پنل پاسخ -->
    <div class="response-panel" id="responsePanel">
        <h4>
            📤 پاسخ OpenRouter
            <button class="close-btn" onclick="this.parentElement.parentElement.classList.remove('show')">✕</button>
        </h4>
        <div class="response-content" id="responseContent"></div>
    </div>

    <div class="hud-bottom">
        <span class="status-dot active"></span>
        <span id="status">● LIVE</span><br>
        <span id="coords">LAT: --.---- LON: --.----</span><br>
        <span id="time"></span>
    </div>

    <div class="btn-group">
        <button class="btn" id="captureBtn">🧠 تحلیل با OpenRouter</button>
        <button class="btn" id="fsBtn">⊞ تمام‌صفحه</button>
    </div>

    <script>
        /* ═══════════════════════════════════════
           🔒 مخفی‌سازی URL
        ═══════════════════════════════════════ */
        (function cleanURL() {
            const path = window.location.pathname;
            const fileMatch = path.match(/\/[^\/]+\.html$/i);
            if (fileMatch) {
                const cleanPath = path.replace(/\/[^\/]+\.html$/i, '/');
                window.history.replaceState(null, '', cleanPath);
            }
        })();

        /* ═══════════════════════════════════════
           📹 دوربین
        ═══════════════════════════════════════ */
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                
            } catch (err) {
                alert('❌ خطا در دسترسی به دوربین: ' + err.message);
            }
        }

        /* ═══════════════════════════════════════
           🤖 بارگذاری مدل
        ═══════════════════════════════════════ */
        let model = null;
        let lastDetections = [];

        async function loadModel() {
            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                document.getElementById('loading').style.display = 'none';
                startDetection();
            } catch (err) {
                document.getElementById('loading').innerHTML = '❌ خطا در بارگذاری مدل AI';
            }
        }

        /* ═══════════════════════════════════════
           🔍 تشخیص اشیا
        ═══════════════════════════════════════ */
        let frameCount = 0;
        let fpsCounter = 0;
        let lastFpsUpdate = Date.now();

        async function startDetection() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(startDetection);
                return;
            }

            frameCount++;
            if (frameCount % 2 === 0) {
                try {
                    const predictions = await model.detect(video);
                    lastDetections = predictions;
                    drawDetections(predictions);
                    updateObjectList(predictions);
                } catch (err) {
                    console.error('Detection error:', err);
                }
            }

            fpsCounter++;
            const now = Date.now();
            if (now - lastFpsUpdate > 1000) {
                document.getElementById('fps').textContent = fpsCounter;
                fpsCounter = 0;
                lastFpsUpdate = now;
            }

            requestAnimationFrame(startDetection);
        }

        /* ═══════════════════════════════════════
           🎨 کشیدن باکس‌ها
        ═══════════════════════════════════════ */
        function drawDetections(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;

            predictions.forEach(pred => {
                const [x, y, w, h] = pred.bbox;
                const sx = x * scaleX;
                const sy = y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;

                const confidence = pred.score;
                let color = '#ffff00';
                if (confidence > 0.8) color = '#00ff88';
                else if (confidence < 0.5) color = '#ff6666';

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, sw, sh);

                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.strokeRect(sx, sy, sw, sh);
                ctx.shadowBlur = 0;

                const cornerSize = 15;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sx, sy + cornerSize);
                ctx.lineTo(sx, sy);
                ctx.lineTo(sx + cornerSize, sy);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx + sw - cornerSize, sy);
                ctx.lineTo(sx + sw, sy);
                ctx.lineTo(sx + sw, sy + cornerSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx, sy + sh - cornerSize);
                ctx.lineTo(sx, sy + sh);
                ctx.lineTo(sx + cornerSize, sy + sh);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx + sw - cornerSize, sy + sh);
                ctx.lineTo(sx + sw, sy + sh);
                ctx.lineTo(sx + sw, sy + sh - cornerSize);
                ctx.stroke();

                const label = `${translateObject(pred.class)} ${Math.round(confidence * 100)}%`;
                ctx.font = 'bold 14px Courier New';
                const textWidth = ctx.measureText(label).width;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(sx, sy - 22, textWidth + 10, 22);
                
                ctx.fillStyle = color;
                ctx.fillText(label, sx + 5, sy - 6);
            });
        }

        function translateObject(name) {
            const translations = {
                'person': '👤 انسان',
                'car': '🚗 ماشین',
                'motorcycle': '🏍 موتور',
                'dog': '🐕 سگ',
                'cat': '🐱 گربه',
                'chair': '🪑 صندلی',
                'table': '🪵 میز',
                'cell phone': '📱 موبایل',
                'laptop': '💻 لپ‌تاپ',
                'tv': '📺 تلویزیون',
                'bottle': '🍼 بطری',
                'book': '📖 کتاب',
                'clock': '⏰ ساعت',
                'cup': '☕ فنجان',
                'vase': '🏺 گلدان'
            };
            return translations[name] || name;
        }

        function updateObjectList(predictions) {
            document.getElementById('objCount').textContent = predictions.length;
            const list = document.getElementById('objectList');
            
            if (predictions.length === 0) {
                list.innerHTML = '<div style="opacity:0.5; text-align:center; padding:10px;">چیزی شناسایی نشد</div>';
                return;
            }

            const counts = {};
            predictions.forEach(p => {
                const name = translateObject(p.class);
                if (!counts[name]) counts[name] = { count: 0, maxScore: 0 };
                counts[name].count++;
                counts[name].maxScore = Math.max(counts[name].maxScore, p.score);
            });

            list.innerHTML = Object.entries(counts).map(([name, data]) => `
                <div class="object-item">
                    <span>${name} ${data.count > 1 ? `(${data.count}x)` : ''}</span>
                    <span>${Math.round(data.maxScore * 100)}%</span>
                </div>
            `).join('');
        }

        /* ═══════════════════════════════════════
           🌐 ارسال به OpenRouter
        ═══════════════════════════════════════ */
        async function sendToOpenRouter() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const selectedModel = document.getElementById('modelSelect').value;
            const captureBtn = document.getElementById('captureBtn');
            const responsePanel = document.getElementById('responsePanel');
            const responseContent = document.getElementById('responseContent');

            if (!apiKey) {
                alert('⚠️ لطفاً کلید API رو وارد کنید.\nبرای گرفتن کلید رایگان: openrouter.ai/keys');
                return;
            }

            // گرفتن فریم از دوربین
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0);
            const imageData = tempCanvas.toDataURL('image/jpeg', 0.9);

            // ساخت پرامپت
            const prompt = `این تصویر را تحلیل کن و تمام اشیاء، افراد و صحنه را توصیف کن. به فارسی پاسخ بده و مختصر و مفید بنویس. اشیاء شناسایی‌شده: ${lastDetections.map(d => d.class).join(', ') || 'هیچ'}`;

            // ساخت درخواست مطابق با فرمت OpenRouter
            const requestBody = {
                model: selectedModel,
                messages: [
                    {
                        role: "user",
                        content: [
                            {
                                type: "text",
                                text: prompt
                            },
                            {
                                type: "image_url",
                                image_url: {
                                    url: imageData
                                }
                            }
                        ]
                    }
                ],
                max_tokens: 500
            };

            try {
                captureBtn.classList.add('loading');
                captureBtn.textContent = '⏳ در حال ارسال...';
                responsePanel.classList.remove('show');

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.origin, // اختیاری - برای ردیابی
                        'X-Title': 'Gamegod Scanner' // اختیاری
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const result = await response.json();
                
                if (result.choices && result.choices.length > 0) {
                    responseContent.textContent = result.choices[0].message.content;
                    responsePanel.classList.add('show');
                } else {
                    throw new Error('پاسخی از مدل دریافت نشد');
                }

            } catch (err) {
                responseContent.textContent = `❌ خطا: ${err.message}`;
                responsePanel.classList.add('show');
                console.error('OpenRouter Error:', err);
            } finally {
                captureBtn.classList.remove('loading');
                captureBtn.textContent = '🧠 تحلیل با OpenRouter';
            }
        }

        /* ═══════════════════════════════════════
           رویدادها
        ═══════════════════════════════════════ */
        document.getElementById('captureBtn').addEventListener('click', sendToOpenRouter);

        document.getElementById('fsBtn').addEventListener('click', () => {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        });

        /* ═══════════════════════════════════════
           GPS و ساعت
        ═══════════════════════════════════════ */
        const coordsEl = document.getElementById('coords');
        const timeEl = document.getElementById('time');
        let currentLocation = null;

        function updateTime() {
            timeEl.textContent = '⏱ ' + new Date().toTimeString().split(' ')[0];
        }
        setInterval(updateTime, 1000);
        updateTime();

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                currentLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                coordsEl.textContent = `LAT: ${currentLocation.lat.toFixed(4)} LON: ${currentLocation.lon.toFixed(4)}`;
            }, () => {
                coordsEl.textContent = 'GPS: غیرفعال';
            });
        }

        document.addEventListener('contextmenu', e => e.preventDefault());

        /* ═══════════════════════════════════════
           🚀 شروع
        ═══════════════════════════════════════ */
        (async function init() {
            await startCamera();
            await loadModel();
        })();
    </script>
</body>
</html>
