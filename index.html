<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gamegod AI Scanner</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #00aaff; /* 🔵 آبی */
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.85) contrast(1.1) saturate(1.2);
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 51, 51, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 2;
        }

        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 170, 255, 0.015),
                rgba(0, 170, 255, 0.015) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 3;
        }

        .hud-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
            text-shadow: 0 0 10px #00aaff;
            font-size: 16px;
            letter-spacing: 2px;
            color: #00aaff;
        }

        .info-panel {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff3333;
            padding: 12px 16px;
            font-size: 12px;
            max-width: 280px;
            backdrop-filter: blur(5px);
            border-radius: 4px;
            color: #00aaff;
        }

        .info-panel h3 {
            font-size: 13px;
            margin-bottom: 8px;
            color: #ff3333;
            border-bottom: 1px solid #ff3333;
            padding-bottom: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }

        .object-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .object-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            margin: 3px 0;
            background: rgba(255, 51, 51, 0.1);
            border-left: 3px solid #ff3333;
            font-size: 11px;
            color: #00aaff;
        }

        .hud-bottom {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            font-size: 11px;
            text-align: right;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 14px;
            border: 1px solid #ff3333;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            color: #00aaff;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff3333;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }

        .status-dot.active { background: #00aaff; }
        .status-dot.recording { background: #ff3333; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn {
            padding: 10px 15px;
            background: rgba(255, 51, 51, 0.2);
            border: 1px solid #ff3333;
            color: #ff3333;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-family: inherit;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:active { background: rgba(255, 51, 51, 0.4); }
        .btn.loading { opacity: 0.5; pointer-events: none; }

        .btn.recording {
            background: rgba(255, 51, 51, 0.3);
            border-color: #ff0000;
            color: #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px #ff3333; }
            50% { box-shadow: 0 0 25px #ff3333; }
        }

        .btn-group {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border: 2px solid #ff3333;
            border-radius: 8px;
            color: #00aaff;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 51, 51, 0.2);
            border-top-color: #ff3333;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .api-config {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff3333;
            padding: 12px;
            font-size: 11px;
            border-radius: 4px;
            width: 300px;
            color: #00aaff;
        }

        .api-config h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #ff3333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .api-config label {
            display: block;
            margin-top: 8px;
            font-size: 10px;
            opacity: 0.9;
            color: #00aaff;
        }

        .api-config input,
        .api-config select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff3333;
            color: #00aaff;
            font-family: inherit;
            font-size: 11px;
            margin-top: 4px;
            border-radius: 2px;
        }

        .api-config select option { background: #000; }

        .model-info {
            margin-top: 6px;
            font-size: 9px;
            opacity: 0.6;
            line-height: 1.4;
        }

        .response-panel {
            position: fixed;
            bottom: 100px;
            left: 20px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff3333;
            padding: 12px;
            font-size: 11px;
            border-radius: 4px;
            max-width: 450px;
            max-height: 250px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            display: none;
            color: #00aaff;
        }

        .response-panel.show { display: block; }

        .response-panel h4 {
            font-size: 12px;
            color: #ff3333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 4px 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff3333;
            cursor: pointer;
            font-size: 16px;
        }

        .response-item {
            border-bottom: 1px solid rgba(255, 51, 51, 0.2);
            padding: 8px 0;
            margin-bottom: 8px;
        }

        .response-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            opacity: 0.6;
            margin-bottom: 4px;
        }

        .response-content {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 11px;
            color: #00aaff;
        }

        .record-settings {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ff3333;
        }

        .interval-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .interval-control input {
            width: 60px;
            text-align: center;
        }

        .record-counter {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff0000;
            color: #ff3333;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .record-counter.show {
            display: block;
            animation: pulse 1.5s infinite;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #ff3333; }

        @media (max-width: 768px) {
            .api-config { width: 250px; right: 10px; }
            .response-panel { max-width: 300px; left: 10px; }
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <div class="grid-overlay"></div>
    <canvas id="canvas"></canvas>
    <div class="scan-lines"></div>

    <div class="hud-top">
        ◈ GAMEGOD AI SCANNER ◈<br>
        <small id="modeLabel">STANDBY MODE</small>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>🤖 در حال بارگذاری مدل هوش مصنوعی...</div>
    </div>

    <div class="info-panel">
        <h3>🎯 اشیا شناسایی‌شده</h3>
        <div class="info-row">
            <span>تعداد:</span>
            <span id="objCount">0</span>
        </div>
        <div class="info-row">
            <span>FPS:</span>
            <span id="fps">--</span>
        </div>
        <div class="object-list" id="objectList">
            <div style="opacity:0.5; text-align:center; padding:10px;">در حال اسکن...</div>
        </div>
    </div>

    <div class="api-config">
        <h3>🔑 OpenRouter API</h3>
        
        <label>🔐 API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-xxxx...">
        
        <label>🤖 مدل:</label>
        <select id="modelSelect">
            <option value="openai/gpt-4o-mini" selected>🚀 GPT-4o-mini</option>
            <option value="openai/gpt-4-vision-preview">💎 GPT-4 Vision</option>
            <option value="anthropic/claude-3-5-sonnet">🧠 Claude 3.5</option>
            <option value="google/gemini-flash-1.5">⚡ Gemini Flash (رایگان)</option>
            <option value="meta-llama/llama-3.2-11b-vision">🦙 Llama Vision (رایگان)</option>
        </select>

        <div class="record-settings">
            <label>⏱ فاصله تحلیل خودکار:</label>
            <div class="interval-control">
                <input type="number" id="intervalInput" value="5" min="2" max="60">
                <span style="font-size:10px; opacity:0.7;">ثانیه</span>
            </div>
        </div>
    </div>

    <div class="response-panel" id="responsePanel">
        <h4>
            📜 تاریخچه تحلیل‌ها (<span id="historyCount">0</span>)
            <button class="close-btn" onclick="clearHistory()">🗑</button>
            <button class="close-btn" onclick="this.parentElement.parentElement.classList.remove('show')">✕</button>
        </h4>
        <div id="historyList"></div>
    </div>

    <div class="record-counter" id="recordCounter">
        🔴 REC<br>
        <span id="recCount">0</span><br>
        <small>ارسال‌شده</small>
    </div>

    <div class="hud-bottom">
        <span class="status-dot active" id="statusDot"></span>
        <span id="status">● LIVE</span><br>
        <span id="coords">LAT: --.---- LON: --.----</span><br>
        <span id="time"></span>
    </div>

    <div class="btn-group">
        <button class="btn" id="recordBtn">🔴 شروع حالت رکورد</button>
        <button class="btn" id="captureBtn">🧠 تحلیل دستی</button>
        <button class="btn" id="historyBtn">📜 نمایش تاریخچه</button>
        <button class="btn" id="fsBtn">⊞ تمام‌صفحه</button>
    </div>

    <script>
        /* ═══════════════════════════════════════
           🔒 مخفی‌سازی URL
        ═══════════════════════════════════════ */
        (function cleanURL() {
            const path = window.location.pathname;
            const fileMatch = path.match(/\/[^\/]+\.html$/i);
            if (fileMatch) {
                window.history.replaceState(null, '', path.replace(/\/[^\/]+\.html$/i, '/'));
            }
        })();

        /* ═══════════════════════════════════════
           🎨 رنگ‌های اصلی تم
        ═══════════════════════════════════════ */
        const COLORS = {
            BOX: '#ff3333',        // 🔴 قرمز برای کادرها
            TEXT: '#00aaff',       // 🔵 آبی برای نوشته‌ها
            ACCENT: '#ff0000',     // 🔴 قرمز پررنگ
            GLOW: '#ff3333',       // ✨ گلو قرمز
            TEXT_GLOW: '#00aaff'   // ✨ گلو آبی
        };

        /* ═══════════════════════════════════════
           📦 آیکون و نام فارسی اشیا
        ═══════════════════════════════════════ */
        const objectInfo = {
            'person': { icon: '👤', fa: 'انسان' },
            'bicycle': { icon: '🚲', fa: 'دوچرخه' },
            'car': { icon: '🚗', fa: 'ماشین' },
            'motorcycle': { icon: '🏍', fa: 'موتور' },
            'airplane': { icon: '✈', fa: 'هواپیما' },
            'bus': { icon: '🚌', fa: 'اتوبوس' },
            'train': { icon: '🚂', fa: 'قطار' },
            'truck': { icon: '🚚', fa: 'کامیون' },
            'boat': { icon: '🚤', fa: 'قایق' },
            'traffic light': { icon: '🚦', fa: 'چراغ راهنمایی' },
            'fire hydrant': { icon: '🚒', fa: 'شیر آتش‌نشانی' },
            'stop sign': { icon: '🛑', fa: 'تابلو ایست' },
            'bench': { icon: '🪑', fa: 'نیمکت' },
            'bird': { icon: '🐦', fa: 'پرنده' },
            'cat': { icon: '🐱', fa: 'گربه' },
            'dog': { icon: '🐕', fa: 'سگ' },
            'horse': { icon: '🐎', fa: 'اسب' },
            'sheep': { icon: '🐑', fa: 'گوسفند' },
            'cow': { icon: '🐄', fa: 'گاو' },
            'umbrella': { icon: '☂', fa: 'چتر' },
            'handbag': { icon: '👜', fa: 'کیف' },
            'suitcase': { icon: '🧳', fa: 'چمدان' },
            'bottle': { icon: '🍼', fa: 'بطری' },
            'wine glass': { icon: '🍷', fa: 'لیوان' },
            'cup': { icon: '☕', fa: 'فنجان' },
            'fork': { icon: '🍴', fa: 'چنگال' },
            'knife': { icon: '🔪', fa: 'چاقو' },
            'spoon': { icon: '🥄', fa: 'قاشق' },
            'bowl': { icon: '🥣', fa: 'کاسه' },
            'banana': { icon: '🍌', fa: 'موز' },
            'apple': { icon: '🍎', fa: 'سیب' },
            'orange': { icon: '🍊', fa: 'پرتقال' },
            'book': { icon: '📖', fa: 'کتاب' },
            'clock': { icon: '⏰', fa: 'ساعت' },
            'vase': { icon: '🏺', fa: 'گلدان' },
            'scissors': { icon: '✂', fa: 'قیچی' },
            'teddy bear': { icon: '🧸', fa: 'عروسک' },
            'toothbrush': { icon: '🪥', fa: 'مسواک' },
            'tv': { icon: '📺', fa: 'تلویزیون' },
            'laptop': { icon: '💻', fa: 'لپ‌تاپ' },
            'mouse': { icon: '🖱', fa: 'ماوس' },
            'remote': { icon: '📱', fa: 'کنترل' },
            'keyboard': { icon: '⌨', fa: 'صفحه‌کلید' },
            'cell phone': { icon: '📱', fa: 'موبایل' },
            'microwave': { icon: '🔥', fa: 'مایکروویو' },
            'oven': { icon: '🔥', fa: 'فر' },
            'toaster': { icon: '🍞', fa: 'تستر' },
            'sink': { icon: '🚰', fa: 'سینک' },
            'refrigerator': { icon: '🧊', fa: 'یخچال' },
            'bed': { icon: '🛏', fa: 'تخت' },
            'toilet': { icon: '🚽', fa: 'توالت' },
            'chair': { icon: '🪑', fa: 'صندلی' },
            'couch': { icon: '🛋', fa: 'کاناپه' },
            'potted plant': { icon: '🪴', fa: 'گلدان' },
            'dining table': { icon: '🍽', fa: 'میز غذا' }
        };

        /* ═══════════════════════════════════════
           📹 دوربین
        ═══════════════════════════════════════ */
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                
            } catch (err) {
                alert('❌ خطا در دسترسی به دوربین: ' + err.message);
            }
        }

        /* ═══════════════════════════════════════
           🤖 بارگذاری مدل
        ═══════════════════════════════════════ */
        let model = null;
        let lastDetections = [];
        let objectIds = new Map();

        async function loadModel() {
            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                document.getElementById('loading').style.display = 'none';
                startDetection();
            } catch (err) {
                document.getElementById('loading').innerHTML = '❌ خطا در بارگذاری مدل AI';
            }
        }

        /* ═══════════════════════════════════════
           🔍 تشخیص اشیا
        ═══════════════════════════════════════ */
        let frameCount = 0;
        let fpsCounter = 0;
        let lastFpsUpdate = Date.now();

        async function startDetection() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(startDetection);
                return;
            }

            frameCount++;
            if (frameCount % 2 === 0) {
                try {
                    const predictions = await model.detect(video);
                    lastDetections = predictions;
                    assignObjectIds(predictions);
                    drawAdvancedHUD(predictions);
                    updateObjectList(predictions);
                } catch (err) {
                    console.error('Detection error:', err);
                }
            }

            fpsCounter++;
            const now = Date.now();
            if (now - lastFpsUpdate > 1000) {
                document.getElementById('fps').textContent = fpsCounter;
                fpsCounter = 0;
                lastFpsUpdate = now;
            }

            requestAnimationFrame(startDetection);
        }

        /* ═══════════════════════════════════════
           🆔 ردیابی اشیا
        ═══════════════════════════════════════ */
        function assignObjectIds(predictions) {
            const newIds = new Map();
            
            predictions.forEach((pred, idx) => {
                const [x, y, w, h] = pred.bbox;
                const centerX = x + w / 2;
                const centerY = y + h / 2;
                
                let bestId = null;
                let minDist = Infinity;
                
                objectIds.forEach((oldPos, oldId) => {
                    if (oldPos.class === pred.class) {
                        const dist = Math.sqrt(
                            Math.pow(centerX - oldPos.x, 2) + 
                            Math.pow(centerY - oldPos.y, 2)
                        );
                        if (dist < minDist && dist < 200) {
                            minDist = dist;
                            bestId = oldId;
                        }
                    }
                });
                
                if (!bestId) {
                    bestId = `ID-${String(objectIds.size + idx + 1).padStart(3, '0')}`;
                }
                
                newIds.set(bestId, { x: centerX, y: centerY, class: pred.class });
                pred.trackingId = bestId;
            });
            
            objectIds = newIds;
        }

        /* ═══════════════════════════════════════
           🎨 رسم HUD با تم قرمز-آبی
        ═══════════════════════════════════════ */
        function drawAdvancedHUD(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;

            // ═══ خطوط اتصال از مرکز (قرمز) ═══
            if (predictions.length > 0) {
                ctx.strokeStyle = 'rgba(255, 51, 51, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                predictions.forEach(pred => {
                    const [x, y, w, h] = pred.bbox;
                    const targetX = (x + w / 2) * scaleX;
                    const targetY = (y + h / 2) * scaleY;
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(targetX, targetY);
                    ctx.stroke();
                });
                
                ctx.setLineDash([]);
                
                // نقطه مرکز (آبی)
                ctx.fillStyle = 'rgba(0, 170, 255, 0.5)';
                ctx.shadowColor = '#00aaff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            predictions.forEach(pred => {
                const [x, y, w, h] = pred.bbox;
                const sx = x * scaleX;
                const sy = y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;

                const info = objectInfo[pred.class] || { 
                    icon: '📦', fa: pred.class 
                };
                const confidence = pred.score;
                const trackingId = pred.trackingId || 'ID-???';

                // ═══ کادر خارجی قرمز با گلو ═══
                ctx.shadowColor = COLORS.BOX;
                ctx.shadowBlur = 15;
                ctx.strokeStyle = COLORS.BOX;
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, sw, sh);
                ctx.shadowBlur = 0;

                // ═══ کادر داخلی نقطه‌چین (قرمز کم‌رنگ) ═══
                ctx.strokeStyle = COLORS.BOX;
                ctx.globalAlpha = 0.3;
                ctx.lineWidth = 1;
                ctx.setLineDash([8, 4]);
                ctx.strokeRect(sx + 5, sy + 5, sw - 10, sh - 10);
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;

                // ═══ گوشه‌های ضخیم تاکیدی (قرمز) ═══
                const cornerSize = Math.min(25, sw / 4, sh / 4);
                ctx.strokeStyle = COLORS.ACCENT;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.shadowColor = COLORS.BOX;
                ctx.shadowBlur = 10;
                
                // بالا-چپ
                ctx.beginPath();
                ctx.moveTo(sx, sy + cornerSize);
                ctx.lineTo(sx, sy);
                ctx.lineTo(sx + cornerSize, sy);
                ctx.stroke();
                
                // بالا-راست
                ctx.beginPath();
                ctx.moveTo(sx + sw - cornerSize, sy);
                ctx.lineTo(sx + sw, sy);
                ctx.lineTo(sx + sw, sy + cornerSize);
                ctx.stroke();
                
                // پایین-چپ
                ctx.beginPath();
                ctx.moveTo(sx, sy + sh - cornerSize);
                ctx.lineTo(sx, sy + sh);
                ctx.lineTo(sx + cornerSize, sy + sh);
                ctx.stroke();
                
                // پایین-راست
                ctx.beginPath();
                ctx.moveTo(sx + sw - cornerSize, sy + sh);
                ctx.lineTo(sx + sw, sy + sh);
                ctx.lineTo(sx + sw, sy + sh - cornerSize);
                ctx.stroke();
                
                ctx.shadowBlur = 0;

                // ═══ برچسب اطلاعات ═══
                drawInfoLabel(sx, sy - 45, trackingId, info.icon, info.fa, confidence);

                // ═══ نقاط گوشه (آبی) ═══
                ctx.fillStyle = COLORS.TEXT;
                ctx.shadowColor = COLORS.TEXT;
                ctx.shadowBlur = 8;
                const pointSize = 3;
                [[sx, sy], [sx + sw, sy], [sx, sy + sh], [sx + sw, sy + sh]].forEach(([px, py]) => {
                    ctx.beginPath();
                    ctx.arc(px, py, pointSize, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;

                // ═══ خطوط مرکزی کراس‌هیر (آبی) ═══
                const centerX = sx + sw / 2;
                const centerY = sy + sh / 2;
                ctx.strokeStyle = COLORS.TEXT;
                ctx.globalAlpha = 0.5;
                ctx.lineWidth = 1;
                
                // خط افقی
                ctx.beginPath();
                ctx.moveTo(sx + 10, centerY);
                ctx.lineTo(centerX - 8, centerY);
                ctx.moveTo(centerX + 8, centerY);
                ctx.lineTo(sx + sw - 10, centerY);
                ctx.stroke();
                
                // خط عمودی
                ctx.beginPath();
                ctx.moveTo(centerX, sy + 10);
                ctx.lineTo(centerX, centerY - 8);
                ctx.moveTo(centerX, centerY + 8);
                ctx.lineTo(centerX, sy + sh - 10);
                ctx.stroke();
                
                ctx.globalAlpha = 1;

                // ═══ نوار اطمینان (قرمز) ═══
                const barWidth = sw - 20;
                const barHeight = 4;
                const barX = sx + 10;
                const barY = sy + sh + 8;
                
                // پس‌زمینه نوار
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                
                // نوار اطمینان قرمز
                ctx.fillStyle = COLORS.BOX;
                ctx.shadowColor = COLORS.BOX;
                ctx.shadowBlur = 5;
                ctx.fillRect(barX, barY, barWidth * confidence, barHeight);
                ctx.shadowBlur = 0;
                
                // متن درصد (آبی)
                ctx.fillStyle = COLORS.TEXT;
                ctx.shadowColor = COLORS.TEXT;
                ctx.shadowBlur = 5;
                ctx.font = 'bold 10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.round(confidence * 100)}%`, centerX, barY + barHeight + 12);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
            });
        }

        /* ═══════════════════════════════════════
           🏷 رسم برچسب اطلاعات (کادر قرمز، متن آبی)
        ═══════════════════════════════════════ */
        function drawInfoLabel(x, y, id, icon, name, confidence) {
            ctx.font = 'bold 13px Courier New';
            const text = `${icon} ${name}`;
            const idText = `${id} • ${Math.round(confidence * 100)}%`;
            
            const textWidth = ctx.measureText(text).width;
            const idWidth = ctx.measureText(idText).width;
            const totalWidth = Math.max(textWidth, idWidth) + 24;
            const totalHeight = 42;
            
            // تنظیم موقعیت اگه از صفحه بیرون زد
            if (x + totalWidth > canvas.width) x = canvas.width - totalWidth - 5;
            if (x < 5) x = 5;
            if (y < 5) y = 5;
            
            // ═══ پس‌زمینه برچسب (مشکی) ═══
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(x, y, totalWidth, totalHeight);
            
            // ═══ حاشیه قرمز با گلو ═══
            ctx.strokeStyle = COLORS.BOX;
            ctx.lineWidth = 2;
            ctx.shadowColor = COLORS.BOX;
            ctx.shadowBlur = 10;
            ctx.strokeRect(x, y, totalWidth, totalHeight);
            ctx.shadowBlur = 0;
            
            // ═══ نوار رنگی سمت راست (آبی) ═══
            ctx.fillStyle = COLORS.TEXT;
            ctx.fillRect(x + totalWidth - 4, y, 4, totalHeight);
            
            // ═══ خط جداکننده وسط ═══
            ctx.strokeStyle = 'rgba(255, 51, 51, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + 6, y + 24);
            ctx.lineTo(x + totalWidth - 10, y + 24);
            ctx.stroke();
            
            // ═══ ردیف اول: آیکون + نام (آبی) ═══
            ctx.fillStyle = COLORS.TEXT;
            ctx.shadowColor = COLORS.TEXT;
            ctx.shadowBlur = 5;
            ctx.font = 'bold 14px Courier New';
            ctx.fillText(text, x + 8, y + 17);
            ctx.shadowBlur = 0;
            
            // ═══ ردیف دوم: ID + درصد (قرمز) ═══
            ctx.fillStyle = COLORS.BOX;
            ctx.shadowColor = COLORS.BOX;
            ctx.shadowBlur = 5;
            ctx.font = 'bold 11px Courier New';
            ctx.fillText(idText, x + 8, y + 35);
            ctx.shadowBlur = 0;
        }

        function updateObjectList(predictions) {
            document.getElementById('objCount').textContent = predictions.length;
            const list = document.getElementById('objectList');
            
            if (predictions.length === 0) {
                list.innerHTML = '<div style="opacity:0.5; text-align:center; padding:10px;">چیزی شناسایی نشد</div>';
                return;
            }

            const counts = {};
            predictions.forEach(p => {
                const info = objectInfo[p.class] || { icon: '📦', fa: p.class };
                const name = `${info.icon} ${info.fa}`;
                if (!counts[name]) counts[name] = { count: 0, maxScore: 0 };
                counts[name].count++;
                counts[name].maxScore = Math.max(counts[name].maxScore, p.score);
            });

            list.innerHTML = Object.entries(counts).map(([name, data]) => `
                <div class="object-item">
                    <span>${name} ${data.count > 1 ? `(${data.count}x)` : ''}</span>
                    <span>${Math.round(data.maxScore * 100)}%</span>
                </div>
            `).join('');
        }

        /* ═══════════════════════════════════════
           🌐 ارسال به OpenRouter
        ═══════════════════════════════════════ */
        let isRecording = false;
        let recordInterval = null;
        let history = [];
        let recordCount = 0;

        async function analyzeFrame(isManual = false) {
            const apiKey = document.getElementById('apiKey').value.trim();
            const selectedModel = document.getElementById('modelSelect').value;
            const responsePanel = document.getElementById('responsePanel');

            if (!apiKey) {
                if (isManual) {
                    alert('⚠️ لطفاً کلید API رو وارد کنید.');
                } else {
                    stopRecording();
                    alert('⚠️ کلید API رو وارد کنید.');
                }
                return;
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0);
            const imageData = tempCanvas.toDataURL('image/jpeg', 0.8);

            const detectedObjects = lastDetections.map(d => {
                const info = objectInfo[d.class] || { fa: d.class };
                return `${info.fa} (${Math.round(d.score * 100)}%)`;
            }).join(', ');
            
            const prompt = `این تصویر را تحلیل کن. 
۱. صحنه کلی رو توصیف کن
۲. تمام اشیا، افراد و جزئیات مهم رو فهرست کن
۳. اگه نکته خاصی هست بگو
به فارسی پاسخ بده. مختصر و مفید بنویس (حداکثر ۱۰۰ کلمه).
اشیا شناسایی‌شده توسط سیستم: ${detectedObjects || 'هیچ'}`;

            const requestBody = {
                model: selectedModel,
                messages: [{
                    role: "user",
                    content: [
                        { type: "text", text: prompt },
                        { type: "image_url", image_url: { url: imageData } }
                    ]
                }],
                max_tokens: 300
            };

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Gamegod Scanner'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                
                if (result.choices && result.choices.length > 0) {
                    const content = result.choices[0].message.content;
                    const timestamp = new Date().toLocaleTimeString('fa-IR');
                    
                    addToHistory(content, timestamp, detectedObjects);
                    responsePanel.classList.add('show');
                    
                    recordCount++;
                    document.getElementById('recCount').textContent = recordCount;
                }
            } catch (err) {
                console.error('❌ OpenRouter Error:', err);
                if (!isManual) {
                    stopRecording();
                    alert('❌ خطا: ' + err.message);
                }
            }
        }

        function addToHistory(content, timestamp, objects) {
            history.unshift({ content, timestamp, objects, id: Date.now() });
            if (history.length > 10) history.pop();
            updateHistoryPanel();
        }

        function updateHistoryPanel() {
            const list = document.getElementById('historyList');
            document.getElementById('historyCount').textContent = history.length;
            
            if (history.length === 0) {
                list.innerHTML = '<div style="opacity:0.5; text-align:center; padding:20px;">تاریخچه خالی است</div>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="response-item">
                    <div class="response-meta">
                        <span>⏱ ${item.timestamp}</span>
                        <span>🎯 ${item.objects ? item.objects.split(',').length + ' شیء' : 'بدون اشیا'}</span>
                    </div>
                    <div class="response-content">${item.content}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            recordCount = 0;
            document.getElementById('recCount').textContent = '0';
            updateHistoryPanel();
        }

        function startRecording() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('⚠️ لطفاً اول کلید API رو وارد کنید.');
                return;
            }

            const intervalSec = parseInt(document.getElementById('intervalInput').value) || 5;
            if (intervalSec < 2) {
                alert('⚠️ فاصله حداقل ۲ ثانیه باشه.');
                return;
            }

            isRecording = true;
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordBtn').textContent = '⏹ توقف رکورد';
            document.getElementById('recordCounter').classList.add('show');
            document.getElementById('modeLabel').textContent = '● RECORDING MODE';
            document.getElementById('modeLabel').style.color = '#ff3333';
            document.getElementById('statusDot').classList.add('recording');

            analyzeFrame(false);
            recordInterval = setInterval(() => {
                if (isRecording) analyzeFrame(false);
            }, intervalSec * 1000);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(recordInterval);
            
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordBtn').textContent = '🔴 شروع حالت رکورد';
            document.getElementById('recordCounter').classList.remove('show');
            document.getElementById('modeLabel').textContent = 'STANDBY MODE';
            document.getElementById('modeLabel').style.color = '#00aaff';
            document.getElementById('statusDot').classList.remove('recording');
        }

        /* ═══════════════════════════════════════
           رویدادها
        ═══════════════════════════════════════ */
        document.getElementById('recordBtn').addEventListener('click', () => {
            if (isRecording) stopRecording();
            else startRecording();
        });

        document.getElementById('captureBtn').addEventListener('click', () => analyzeFrame(true));
        document.getElementById('historyBtn').addEventListener('click', () => {
            document.getElementById('responsePanel').classList.toggle('show');
        });

        document.getElementById('fsBtn').addEventListener('click', () => {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        });

        /* ═══════════════════════════════════════
           GPS و ساعت
        ═══════════════════════════════════════ */
        const coordsEl = document.getElementById('coords');
        const timeEl = document.getElementById('time');

        function updateTime() {
            timeEl.textContent = '⏱ ' + new Date().toTimeString().split(' ')[0];
        }
        setInterval(updateTime, 1000);
        updateTime();

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                coordsEl.textContent = `LAT: ${pos.coords.latitude.toFixed(4)} LON: ${pos.coords.longitude.toFixed(4)}`;
            }, () => {
                coordsEl.textContent = 'GPS: غیرفعال';
            });
        }

        document.addEventListener('contextmenu', e => e.preventDefault());

        /* ═══════════════════════════════════════
           🚀 شروع
        ═══════════════════════════════════════ */
        (async function init() {
            await startCamera();
            await loadModel();
        })();
    </script>
</body>
</html>
