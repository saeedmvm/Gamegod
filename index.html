const toArr=c=>Array.isArray(c)?c:[c.lng,c.lat];
function lerpPose(a,b,t){
 const A=toArr(a.center),B=toArr(b.center),db=((b.bearing-a.bearing+540)%360)-180;
 return{center:[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t],zoom:a.zoom+(b.zoom-a.zoom)*t,pitch:a.pitch+(b.pitch-a.pitch)*t,bearing:a.bearing+db*t};
}
function poseAt(T){
 const i=clipAt(T),S=clipStart(i),E=S+clips[i].dur;let pose=autoCam(T);
 const ks=keys.filter(q=>q.ts>=S&&q.ts<E&&q.ts<=T).sort((a,b)=>a.ts-b.ts);
 for(const q of ks){
  const kp={center:q.center,zoom:q.zoom,pitch:q.pitch,bearing:q.bearing};
  if(T>=q.ts+q.dur)pose=kp;
  else{const p=Math.max(0,(T-q.ts)/q.dur),e=q.mode==='linear'?p:p*p*(3-2*p);pose=lerpPose(pose,kp,e);break}
 }
 return pose;
}

function pathSampler(pts,smooth){
 const key=JSON.stringify([pts,smooth]);if(psC.has(key))return psC.get(key);

  const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)],sm=smooth&&P.length>2,n=sm?16:1;
  for(let k=0;k<n;k++){
   const t=k/n;
   if(!sm)S.push([p1[0]+(p2[0]-p1[0])*t,p1[1]+(p2[1]-p1[1])*t]);
   else{const t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);S.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])])}
  }
 }
 S.push(P[P.length-1]);
 const cum=[0];for(let i=1;i<S.length;i++)cum.push(cum[i-1]+Math.hypot(S[i][0]-S[i-1][0],S[i][1]-S[i-1][1]));
 const L=cum[cum.length-1]||1e-9;

/* unlimited colours: native picker + any CSS colour (#hex, #hex8, rgb(), hsl(), names) with alpha */
function parseCss(v){const x=document.createElement('canvas').getContext('2d');x.fillStyle='#010203';x.fillStyle=v;const a=x.fillStyle;x.fillStyle='#040506';x.fillStyle=v;return a===x.fillStyle?a:null}
function toHex(n){if(n[0]==='#')return n.slice(0,7);const m=n.match(/[\d.]+/g);return'#'+[0,1,2].map(i=>(Math.round(+m[i])).toString(16).padStart(2,'0')).join('')}

function drawRecent(){$('#recent').innerHTML=recent.map(c=>`<option value="${c}">`).join('')}
function remember(c){recent=[c,...recent.filter(x=>x!==c)].slice(0,16);drawRecent();try{localStorage.setItem('recentColors',JSON.stringify(recent))}catch(_){}}
function enhanceColor(el){
 const t=document.createElement('input');t.type='text';t.className='hx';t.spellcheck=false;t.placeholder='#hex or rgba()';t.setAttribute('list','recent');
 el.after(t);
 const d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');let full=d.get.call(el),own=false;
 Object.defineProperty(el,'value',{configurable:true,get(){return full},set(v){full=v;t.value=v;const n=parseCss(v);if(n)d.set.call(el,toHex(n))}});
 el.addEventListener('input',()=>{if(own){own=false;return}full=d.get.call(el);t.value=full});
 el.addEventListener('change',()=>remember(full));
 t.addEventListener('input',()=>{const n=parseCss(t.value);if(!n)return;full=n;d.set.call(el,toHex(n));own=true;el.dispatchEvent(new Event('input',{bubbles:true}));own=false});
 t.addEventListener('change',()=>{const n=parseCss(t.value);if(!n)return;el.dispatchEvent(new Event('change',{bubbles:true}))});
 t.value=full;
}
drawRecent();
['col','cf','cb','fe-col','fe-body','fe-bc','fe-ckc'].forEach(id=>enhanceColor($('#'+id)));
