<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gamegod Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #00ff88;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* افکت اسکن‌لاین */
        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 136, 0.03),
                rgba(0, 255, 136, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 2;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        /* 🔄 خط اسکن تمام‌صفحه - از بالا به پایین حرکت می‌کنه */
        .full-scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 4px;
            background: linear-gradient(
                180deg,
                transparent 0%,
                #00ff88 40%,
                #ffffff 50%,
                #00ff88 60%,
                transparent 100%
            );
            box-shadow: 
                0 0 20px #00ff88,
                0 0 40px #00ff88,
                0 0 60px rgba(0, 255, 136, 0.5);
            z-index: 3;
            animation: fullScan 3s ease-in-out infinite;
            pointer-events: none;
        }

        /* سایه نور بعد از عبور خط */
        .full-scan-line::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(
                180deg,
                rgba(0, 255, 136, 0.2) 0%,
                rgba(0, 255, 136, 0.05) 60%,
                transparent 100%
            );
        }

        @keyframes fullScan {
            0% {
                top: -10px;
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        /* HUD بالا */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 4;
            text-shadow: 0 0 10px #00ff88;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .hud-bottom {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 4;
            font-size: 12px;
            opacity: 0.8;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff3333;
            border-radius: 50%;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
            backdrop-filter: blur(5px);
            font-family: inherit;
        }

        .btn:active {
            background: rgba(0, 255, 136, 0.4);
        }

        /* گوشه‌های صفحه - دکوراتیو */
        .page-corner {
            position: fixed;
            width: 50px;
            height: 50px;
            border-color: #00ff88;
            border-style: solid;
            border-width: 0;
            z-index: 4;
            opacity: 0.6;
        }
        .page-corner.tl { top: 15px; left: 15px; border-top-width: 3px; border-left-width: 3px; }
        .page-corner.tr { top: 15px; right: 15px; border-top-width: 3px; border-right-width: 3px; }
        .page-corner.bl { bottom: 15px; left: 15px; border-bottom-width: 3px; border-left-width: 3px; }
        .page-corner.br { bottom: 15px; right: 15px; border-bottom-width: 3px; border-right-width: 3px; }

        /* حالت تمام‌صفحه */
        :-webkit-full-screen { background: #000; }
        :fullscreen { background: #000; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <div class="scan-lines"></div>

    <!-- خط اسکن تمام‌صفحه -->
    <div class="full-scan-line"></div>

    <!-- گوشه‌های دکوراتیو صفحه -->
    <div class="page-corner tl"></div>
    <div class="page-corner tr"></div>
    <div class="page-corner bl"></div>
    <div class="page-corner br"></div>

    <div class="hud-top">
        ◈ GAMEGOD SCANNER ◈<br>
        <small>ENVIRONMENT ANALYSIS MODE</small>
    </div>

    <div class="hud-bottom">
        <span id="status">● LIVE</span><span class="status-dot"></span>
        <br>
        <span id="coords">LAT: --.---- LON: --.----</span>
        <br>
        <span id="time"></span>
    </div>

    <button class="btn" id="fsBtn">⊞ تمام‌صفحه</button>

    <script>
        /* ═══════════════════════════════════════
           🔒 مخفی‌سازی نام فایل از URL
        ═══════════════════════════════════════ */
        (function cleanURL() {
            const path = window.location.pathname;
            const fileMatch = path.match(/\/[^\/]+\.html$/i);
            if (fileMatch) {
                const cleanPath = path.replace(/\/[^\/]+\.html$/i, '/');
                window.history.replaceState(null, '', cleanPath);
            }
        })();

        /* ═══════════════════════════════════════
           📹 دسترسی به دوربین
        ═══════════════════════════════════════ */
        const video = document.getElementById('video');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('❌ خطا در دسترسی به دوربین: ' + err.message);
            }
        }

        startCamera();

        /* ═══════════════════════════════════════
           ⊞ تمام‌صفحه
        ═══════════════════════════════════════ */
        document.getElementById('fsBtn').addEventListener('click', () => {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        });

        /* ═══════════════════════════════════════
           📍 HUD
        ═══════════════════════════════════════ */
        const coordsEl = document.getElementById('coords');
        const timeEl = document.getElementById('time');

        function updateTime() {
            const now = new Date();
            timeEl.textContent = '⏱ ' + now.toTimeString().split(' ')[0];
        }
        setInterval(updateTime, 1000);
        updateTime();

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                const lat = pos.coords.latitude.toFixed(4);
                const lon = pos.coords.longitude.toFixed(4);
                coordsEl.textContent = `LAT: ${lat} LON: ${lon}`;
            }, () => {
                coordsEl.textContent = 'GPS: غیرفعال';
            });
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
