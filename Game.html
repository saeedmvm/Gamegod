<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دسترسی به دوربین</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #1e1e2e;
            color: #fff;
        }
        video {
            width: 640px;
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #444;
        }
        button {
            margin: 10px 5px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #4a90d9;
            color: white;
        }
        button:hover { background: #357abd; }
        canvas { display: none; }
        #photo { margin-top: 15px; max-width: 640px; border-radius: 12px; }
    </style>
</head>
<body>
    <h2>📷 دسترسی به دوربین</h2>
    <video id="video" autoplay playsinline></video>
    <div>
        <button id="startBtn">شروع دوربین</button>
        <button id="captureBtn">عکس گرفتن</button>
        <button id="stopBtn">توقف</button>
    </div>
    <canvas id="canvas"></canvas>
    <img id="photo" alt="">

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        let stream = null;

        // شروع دوربین
        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('خطا در دسترسی به دوربین: ' + err.message);
            }
        });

        // عکس گرفتن
        document.getElementById('captureBtn').addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photo.src = canvas.toDataURL('image/png');
        });

        // توقف دوربین
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        });
    </script>
</body>
</html>
